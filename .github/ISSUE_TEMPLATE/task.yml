name: Project task
description: Track one concrete, reviewable unit of project work.
title: "[Task]: "
labels:
  - type:task
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome must this task produce?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide a checklist that proves the task is complete.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blocking or related issues and identify shared contracts.
  - type: dropdown
    id: owner_area
    attributes:
      label: Primary area
      options:
        - API / Authentication
        - Business / Domain
        - Database / Infrastructure
        - Shared
    validations:
      required: true
